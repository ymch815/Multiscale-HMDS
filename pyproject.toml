[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiscale-hmds"
version = "2.0.0.dev0"
description = "Scalable hyperbolic multidimensional scaling"
readme = "ReadMe.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
stan = ["cmdstanpy>=1.1"]

[tool.setuptools]
packages = ["MHMDS"]
include-package-data = true

[tool.setuptools.package-data]
MHMDS = ["*.stan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

